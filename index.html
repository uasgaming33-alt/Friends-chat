
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Friends Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- Website Logo -->
    <div class="logo-area">
      <img src="mmt.logo.png" alt="Friends Chat Logo">
    </div>

    <h1>Friends Chat</h1>

    <!-- Login and Signup -->
    <div id="authSection">

      <h2>Create Account</h2>

      <input
        id="name"
        type="text"
        placeholder="Your Name"
      >

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="signupBtn" type="button">
        Sign Up
      </button>

      <button id="loginBtn" type="button">
        Login
      </button>

    </div>

    <!-- Chat Section -->
    <div id="chatSection" hidden>

      <!-- Profile -->
      <div class="profile">

        <img
          id="profilePhoto"
          src="https://placehold.co/100x100"
          alt="Profile Photo"
        >

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >

        <button id="uploadPhotoBtn" type="button">
          Save Profile Photo
        </button>

      </div>

      <h2>My Chat</h2>

      <button id="logoutBtn" type="button">
        Logout
      </button>

      <!-- Friends -->
      <div class="friends-area">

        <h3>My Friends</h3>

        <div id="friendsList">
          Loading friends...
        </div>

      </div>

      <!-- Chat Header -->
      <div id="chatHeader">
        Select a friend to chat
      </div>

      <!-- Typing Indicator -->
      <div id="typingIndicator"></div>

      <!-- Messages -->
      <div id="messages"></div>

      <!-- Message Input -->
      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
      >

      <button id="sendBtn" type="button">
        Send ➤
      </button>

    </div>

  </div>

  <!-- Firebase JavaScript -->
  <script type="module" src="./app.js"></script>

</body>
</html>
