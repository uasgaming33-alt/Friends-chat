
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Friends Chat</h1>

<div id="authSection">
<h2>Create Account</h2>
<input id="name" type="text" placeholder="Your Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signupBtn">Sign Up</button>
<button id="loginBtn">Login</button>
</div>

<div id="chatSection" hidden>
<div class="profile">
<img id="profilePhoto" src="https://placehold.co/100x100" alt="Profile Photo">
<input type="file" id="photoInput" accept="image/*">
<button id="uploadPhotoBtn">Save Profile Photo</button>
</div>

<h2>My Chat</h2>
<button id="logoutBtn">Logout</button>

<div class="friends-area">
<h3>My Friends</h3>
<div id="friendsList">Loading friends...</div>
</div>

<div id="chatHeader">Select a friend to chat</div>

<div id="typingIndicator"></div>

<div id="messages"></div>

<input id="messageInput" type="text" placeholder="Type a message...">
<button id="sendBtn">Send ➤</button>
</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
