<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Friends Chat</title>  <style>  
* {  
  box-sizing: border-box;  
}  
  
body {  
  margin: 0;  
  font-family: Arial, sans-serif;  
  background: #e5ddd5;  
}  
  
header {  
  background: #075e54;  
  color: white;  
  padding: 18px;  
  font-size: 22px;  
}  
  
.chat {  
  display: flex;  
  align-items: center;  
  background: white;  
  padding: 14px;  
  border-bottom: 1px solid #ddd;  
  cursor: pointer;  
}  
  
.chat:active {  
  background: #e9e9e9;  
}  
  
.avatar {  
  width: 50px;  
  height: 50px;  
  border-radius: 50%;  
  background: #25d366;  
  color: white;  
  display: grid;  
  place-items: center;  
  font-size: 22px;  
  margin-right: 14px;  
}  
  
.name {  
  font-weight: bold;  
  font-size: 16px;  
}  
  
.status {  
  color: gray;  
  font-size: 13px;  
  margin-top: 5px;  
}  
</style>  </head>  <body>  <header>Friends Chat</header>  <div id="friendsList"></div>  <script>  
const friends = [  
  "Rahul",  
  "Aman",  
  "Umesh",  
  "Raj",  
  "Vikash"  
];  
  
const list = document.getElementById("friendsList");  
  
friends.forEach(name => {  
  const item = document.createElement("div");  
  item.className = "chat";  
  
  const avatar = document.createElement("div");  
  avatar.className = "avatar";  
  avatar.textContent = name.charAt(0).toUpperCase();  
  
  const info = document.createElement("div");  
  
  const title = document.createElement("div");  
  title.className = "name";  
  title.textContent = name;  
  
  const status = document.createElement("div");  
  status.className = "status";  
  status.textContent = "Tap to open chat";  
  
  info.append(title, status);  
  item.append(avatar, info);  
  
  item.onclick = () => {  
    window.location.href =  
      "message.html?name=" + encodeURIComponent(name);  
  };  
  
  list.appendChild(item);  
});  
</script>  </body>  
</html>
