
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5ddd5;
}

header {
  background: #075e54;
  color: white;
  padding: 18px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#logoutBtn {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

#friendsList {
  padding: 12px;
}

#friendsList h3 {
  color: #075e54;
  margin-top: 20px;
}

#friendsList button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  background: #075e54;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <span>Friends Chat</span>
  <button id="logoutBtn">Logout</button>
</header>

<div id="friendsList">Loading friends...</div>

<script type="module" src="./friends.js"></script>

</body>
</html>
