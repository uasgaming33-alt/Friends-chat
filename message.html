
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5ddd5;
}

.header {
  background: #075e54;
  color: white;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  background: #25d366;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.info {
  flex: 1;
}

.info small {
  display: block;
  margin-top: 4px;
  color: #d5eee9;
}

.messages {
  height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  background: white;
  padding: 11px 14px;
  border-radius: 10px;
  max-width: 80%;
  align-self: flex-start;
  overflow-wrap: anywhere;
}

.mine {
  background: #dcf8c6;
  align-self: flex-end;
}

.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  gap: 7px;
  background: #f5f5f5;
}

.footer input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: none;
  border-radius: 25px;
  outline: none;
}

button {
  border: none;
  background: #075e54;
  color: white;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="header">
  <div class="avatar">F</div>
  <div class="info">
    <b id="friendName">Friend</b>
    <small>Friends Chat</small>
  </div>
  <button onclick="alert('Call feature next step')">📞</button>
  <button onclick="alert('Video call feature next step')">📹</button>
</div>

<div class="messages" id="messages">
  <div class="message">Welcome to Friends Chat!</div>
</div>

<div class="footer">
  <input id="messageInput" placeholder="Type a message...">
  <button onclick="sendMessage()">➤</button>
</div>

<script>
const params = new URLSearchParams(location.search);
const name = params.get("name") || "Friend";

document.getElementById("friendName").textContent = name;

function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  const msg = document.createElement("div");
  msg.className = "message mine";
  msg.textContent = text;

  document.getElementById("messages").appendChild(msg);

  input.value = "";
  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;
}

document.getElementById("messageInput")
.addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
  </html>
