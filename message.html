
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5ddd5;
}

header {
  background: #075e54;
  color: white;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
}

header button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
}

#chatHeader {
  font-size: 18px;
  font-weight: bold;
}

#messages {
  height: calc(100vh - 145px);
  overflow-y: auto;
  padding: 12px;
}

.message {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin: 8px 0;
  max-width: 80%;
  overflow-wrap: anywhere;
}

.message.mine {
  background: #dcf8c6;
  margin-left: auto;
}

.sender {
  font-size: 12px;
  font-weight: bold;
  color: #075e54;
}

.time {
  font-size: 10px;
  color: gray;
  text-align: right;
  margin-top: 5px;
}

#typingIndicator {
  padding: 0 12px;
  color: gray;
  font-size: 13px;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 25px;
  outline: none;
}

#sendBtn {
  background: #075e54;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 25px;
}
</style>
</head>

<body>

<header>
  <button onclick="location.href='chat.html'">←</button>
  <div id="chatHeader">Loading...</div>
</header>

<div id="messages"></div>
<div id="typingIndicator"></div>

<div class="input-area">
  <input id="messageInput" type="text" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
</div>

<script type="module" src="./message.js"></script>

</body>
</html>
